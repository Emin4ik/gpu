[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gputriage"
version = "0.2.0a1"
description = "Evidence-first diagnostic planner for AI/GPU infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Emin Bagirov"}]
keywords = ["gpu", "ai-infrastructure", "diagnostics", "nccl", "slurm", "troubleshooting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Emin4ik/gpu"
Repository = "https://github.com/Emin4ik/gpu"
Issues = "https://github.com/Emin4ik/gpu/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gputriage = "gputriage.cli:main"
gputriage-eval = "gputriage.evaluator:main"
gputriage-benchmark = "gputriage.benchmark:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
