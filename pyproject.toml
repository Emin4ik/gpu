[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gputriage"
version = "0.1.0"
description = "Evidence-first diagnostic planner for AI/GPU infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Emin4ik"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gputriage = "gputriage.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
